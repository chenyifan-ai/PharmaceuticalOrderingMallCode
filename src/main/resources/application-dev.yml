server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  http:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  application:
    name: pharmacy-mall

  # 排除Redis自动配置（开发环境不启动Redis）
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  # H2 内存数据库（开发环境，无需外部数据库）
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:pharmacy_mall;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
    username: sa
    password:

  # H2 Console 控制台（开发环境可用 http://localhost:8080/h2-console）
  h2:
    console:
      enabled: true
      path: /h2-console

  # SQL 初始化
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      encoding: UTF-8
      continue-on-error: true

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# MyBatis Plus配置
mybatis-plus:
  type-aliases-package: com.yao.pharmacymall.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: pharmacy-mall-secret-key-2026-yao
  expiration: 86400000
  header: Authorization
  prefix: Bearer

# 本地上传文件存储
file:
  upload:
    path: ./uploads
  access:
    url: /files
  max-size: 10485760

# 日志配置
logging:
  level:
    com.yao.pharmacymall: debug
    org.springframework.security: warn
