name: CI

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend (JUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B test

      - name: Publish backend test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend JUnit
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-surefire
          path: target/surefire-reports/

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: admin-web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: admin-web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: admin-web
        env:
          CI: true
        run: npm run test:e2e

      - name: Publish E2E test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Playwright E2E
          path: admin-web/test-results/junit.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            admin-web/playwright-report/
            admin-web/test-results/

  api-smoke:
    name: API Smoke
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Start backend
        run: |
          ./mvnw -q spring-boot:run -Dspring-boot.run.profiles=dev &
          echo $! > backend.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/api/c/home/ > /dev/null; then
              echo "Backend ready"
              exit 0
            fi
            sleep 3
          done
          echo "Backend failed to start"
          exit 1

      - name: Run API smoke tests
        shell: pwsh
        run: ./scripts/api-smoke-test.ps1 -BaseUrl http://127.0.0.1:8080/api

      - name: Upload API smoke CSV
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-smoke-reports
          path: test-reports/api-smoke-*.csv

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then kill $(cat backend.pid) || true; fi
